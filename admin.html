<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&TO · Lists Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --ink:#0d0d0d; --ink-mid:#666; --ink-light:#aaa;
  --white:#fff; --surface:#f6f6f4; --surface-2:#eeede9;
  --border:#d4d3cf; --border-hover:#a0a09a;
  --red:#dc2626; --amber:#e09a1a; --green:#16a34a;
  --focus-ring:rgba(13,13,13,.1);
  --ctrl-h:2.75rem; --ctrl-r:7px;
}
body { font-family:'Red Hat Display',sans-serif; background:var(--surface-2); color:var(--ink); min-height:100vh; }

/* ── Gate ──────────────────────────────────────── */
.pw-gate { position:fixed; inset:0; z-index:9999; background:var(--surface-2); display:flex; align-items:center; justify-content:center; padding:2rem; }
.pw-gate.hidden { display:none; }
.pw-card { background:var(--white); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.05); padding:2.5rem 2rem; width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; gap:1.25rem; text-align:center; }
.pw-badge { background:var(--ink); color:var(--white); font-size:1.1rem; font-weight:900; letter-spacing:.04em; padding:.2em .55em; border-radius:6px; line-height:1; }
.pw-title { font-size:1.1rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
.pw-sub { font-size:.875rem; color:var(--ink-mid); margin-top:-.5rem; }
.pw-input { font-family:inherit; font-size:1rem; font-weight:500; color:var(--ink); background:var(--white); border:1.5px solid var(--border); border-radius:var(--ctrl-r); height:var(--ctrl-h); padding:0 1rem; outline:none; width:100%; text-align:center; transition:border-color .15s,box-shadow .15s; }
.pw-input:focus { border-color:var(--ink); box-shadow:0 0 0 3px var(--focus-ring); }
.pw-input.error { border-color:var(--red); }
.pw-btn { font-family:inherit; font-size:.8rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; background:var(--ink); color:var(--white); border:none; border-radius:var(--ctrl-r); height:var(--ctrl-h); cursor:pointer; width:100%; transition:opacity .12s; }
.pw-btn:hover { opacity:.82; } .pw-btn:disabled { opacity:.45; cursor:not-allowed; }
.pw-error { font-size:.75rem; color:var(--red); font-weight:600; opacity:0; transition:opacity .2s; }
.pw-error.visible { opacity:1; }

/* ── Layout ────────────────────────────────────── */
.app { display:none; flex-direction:column; min-height:100vh; }
.app.visible { display:flex; }

.top-bar { background:var(--white); border-bottom:1.5px solid var(--border); padding:0 2rem; height:60px; display:flex; align-items:center; gap:.75rem; position:sticky; top:0; z-index:100; }
.top-badge { background:var(--ink); color:var(--white); font-size:.95rem; font-weight:900; letter-spacing:.04em; padding:.2em .5em; border-radius:5px; line-height:1; }
.top-title { font-size:1.1rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
.save-status { font-size:.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:.25em .7em; border-radius:4px; }
.save-status.saving { color:var(--amber); }
.save-status.saved  { color:var(--green); }
.back-link { margin-left:auto; font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-mid); text-decoration:none; display:flex; align-items:center; gap:.35em; transition:color .12s; }
.back-link:hover { color:var(--ink); }

.main { flex:1; padding:1.75rem 2rem; }

.cols { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; }

/* ── List Column ───────────────────────────────── */
.list-col { background:var(--white); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04); display:flex; flex-direction:column; overflow:hidden; }

.col-header { padding:.75rem 1rem; background:var(--surface); border-bottom:1.5px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:.5rem; flex-shrink:0; }
.col-title { font-size:.7rem; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-mid); }
.col-count { font-size:.65rem; font-weight:700; color:var(--ink-light); background:var(--surface-2); padding:.15em .5em; border-radius:20px; }

.col-body { flex:1; overflow-y:auto; max-height:calc(100vh - 220px); }

.list-item { display:flex; align-items:center; border-bottom:1px solid var(--border); }
.list-item:last-child { border-bottom:none; }
.list-item:hover .item-del { opacity:1; }

.item-input { flex:1; font-family:inherit; font-size:.875rem; font-weight:500; color:var(--ink); border:none; outline:none; background:transparent; padding:.6rem .875rem; min-height:2.5rem; }
.item-input:focus { background:#fffde7; }
.item-input::placeholder { color:var(--ink-light); font-weight:400; }

.item-del { opacity:0; background:none; border:none; color:var(--ink-light); cursor:pointer; padding:.4rem .5rem; font-size:.875rem; line-height:1; transition:color .1s, opacity .1s; flex-shrink:0; }
.item-del:hover { color:var(--red); opacity:1 !important; }

.col-empty { padding:2rem 1rem; text-align:center; color:var(--ink-light); font-size:.875rem; font-style:italic; }

/* ── Add row ───────────────────────────────────── */
.col-add { display:flex; border-top:1.5px dashed var(--border); flex-shrink:0; }
.add-input { flex:1; font-family:inherit; font-size:.875rem; font-weight:500; color:var(--ink); border:none; outline:none; background:transparent; padding:.65rem .875rem; }
.add-input:focus { background:#f0fdf4; }
.add-input::placeholder { color:var(--ink-light); font-weight:400; }
.add-btn { font-family:inherit; font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; background:none; border:none; border-left:1.5px dashed var(--border); color:var(--ink-mid); padding:0 .875rem; cursor:pointer; transition:all .12s; white-space:nowrap; }
.add-btn:hover { color:var(--ink); background:var(--surface); }

/* ── Footer ────────────────────────────────────── */
.page-footer { padding:1.25rem 2rem; display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
.btn-csv { background:var(--white); color:var(--ink-mid); border:1.5px solid var(--border); font-family:inherit; font-size:.7rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; border-radius:var(--ctrl-r); padding:.45em 1em; cursor:pointer; transition:all .12s; display:inline-flex; align-items:center; gap:.4em; }
.btn-csv:hover { border-color:var(--ink); color:var(--ink); }
.footer-tip { font-size:.7rem; color:var(--ink-light); margin-left:auto; }
</style>
</head>
<body>

<div class="pw-gate" id="pwGate">
  <div class="pw-card">
    <div class="pw-badge">P&amp;TO</div>
    <div class="pw-title">Lists Admin</div>
    <div class="pw-sub">Enter your access password</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="Enter password" autocomplete="new-password">
    <button class="pw-btn" id="pwBtn">Enter</button>
    <div class="pw-error" id="pwError">Incorrect password — try again</div>
  </div>
</div>

<div class="app" id="app">
  <div class="top-bar">
    <span class="top-badge">P&amp;TO</span>
    <span class="top-title">Lists Admin</span>
    <span class="save-status" id="saveStatus"></span>
    <a class="back-link" href="index.html">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      TOC Request
    </a>
  </div>

  <div class="main">
    <div class="cols">
      <div class="list-col" id="col-feedNames">
        <div class="col-header">
          <span class="col-title">Feed Names</span>
          <span class="col-count" id="count-feedNames">0</span>
        </div>
        <div class="col-body" id="body-feedNames"></div>
        <div class="col-add">
          <input class="add-input" id="add-feedNames" placeholder="Add feed name…" autocomplete="off">
          <button class="add-btn" data-key="feedNames">+ Add</button>
        </div>
      </div>

      <div class="list-col" id="col-sources">
        <div class="col-header">
          <span class="col-title">Sources</span>
          <span class="col-count" id="count-sources">0</span>
        </div>
        <div class="col-body" id="body-sources"></div>
        <div class="col-add">
          <input class="add-input" id="add-sources" placeholder="Add source…" autocomplete="off">
          <button class="add-btn" data-key="sources">+ Add</button>
        </div>
      </div>

      <div class="list-col" id="col-destinations">
        <div class="col-header">
          <span class="col-title">Destinations</span>
          <span class="col-count" id="count-destinations">0</span>
        </div>
        <div class="col-body" id="body-destinations"></div>
        <div class="col-add">
          <input class="add-input" id="add-destinations" placeholder="Add destination…" autocomplete="off">
          <button class="add-btn" data-key="destinations">+ Add</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <button class="btn-csv" id="exportBtn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export All (CSV)
    </button>
    <label class="btn-csv" for="importFile">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import CSV
      <input type="file" id="importFile" accept=".csv,.txt" style="display:none;">
    </label>
    <span class="footer-tip">Changes save automatically to Supabase &nbsp;·&nbsp; All users get updated lists on next load</span>
  </div>
</div>

<script>
const SUPA_URL = 'https://fcjidrzcimzhauwdccup.supabase.co';
const SUPA_KEY = 'sb_publishable_sjrXMt_YICKzTXwwPLZalA_0DqjvvtB';
const SESSION_TTL = 8 * 60 * 60 * 1000;
const KEYS = ['feedNames', 'sources', 'destinations'];

let db = null;
try { const { createClient } = supabase; db = createClient(SUPA_URL, SUPA_KEY); }
catch(e) { console.error(e); }

let lists = { feedNames:[], sources:[], destinations:[] };
let saveTimer = null;

// ── Auth ─────────────────────────────────────────
function hasSession() {
  try { const s=sessionStorage.getItem('toc_s'); if(!s) return false; return Date.now()<JSON.parse(s).exp; }
  catch(e) { return false; }
}
function makeSession() { sessionStorage.setItem('toc_s', JSON.stringify({exp:Date.now()+SESSION_TTL})); }

function showApp() {
  document.getElementById('pwGate').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  loadData();
}

async function attemptLogin() {
  const btn=document.getElementById('pwBtn'), input=document.getElementById('pwInput'), err=document.getElementById('pwError');
  const pw=input.value.trim(); if(!pw){input.focus();return;}
  btn.disabled=true; btn.textContent='Checking…'; err.classList.remove('visible'); input.classList.remove('error');
  try {
    const {data,error}=await db.rpc('verify_app_password',{input_password:pw});
    if(error)throw error;
    if(data===true){makeSession();showApp();}
    else{input.classList.add('error');err.classList.add('visible');input.value='';input.focus();}
  } catch(e){
    err.textContent='Error: '+(e.message||'Could not connect');err.classList.add('visible');
  } finally{btn.disabled=false;btn.textContent='Enter';}
}
document.getElementById('pwBtn').addEventListener('click',attemptLogin);
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin();});
if(hasSession()) showApp();

// ── Data ──────────────────────────────────────────
async function loadData() {
  try {
    const {data,error}=await db.from('toc_lists').select('key,items');
    if(error) throw error;
    if(data) data.forEach(r=>{ if(lists[r.key]!==undefined) lists[r.key]=r.items||[]; });
  } catch(e){ console.warn(e); }
  KEYS.forEach(k=>renderColumn(k));
}

function setSaveStatus(state) {
  const el=document.getElementById('saveStatus');
  if(state==='saving'){el.textContent='Saving…';el.className='save-status saving';}
  else if(state==='saved'){el.textContent='Saved ✓';el.className='save-status saved';setTimeout(()=>{el.textContent='';el.className='save-status';},2000);}
  else{el.textContent='';el.className='save-status';}
}

async function saveKey(key) {
  setSaveStatus('saving');
  try {
    const {error}=await db.from('toc_lists').upsert({key, items:lists[key], updated_at:new Date().toISOString()});
    if(error) throw error;
    setSaveStatus('saved');
  } catch(e){ setSaveStatus(''); console.warn(e); }
}

function schedSave(key) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveKey(key), 600);
}

// ── Render ────────────────────────────────────────
function renderColumn(key) {
  const body = document.getElementById('body-'+key);
  const count = document.getElementById('count-'+key);
  body.innerHTML = '';
  count.textContent = lists[key].length;

  if (!lists[key].length) {
    body.innerHTML = '<div class="col-empty">No items yet</div>';
    return;
  }

  lists[key].forEach((val, idx) => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `<input class="item-input" value="${val.replace(/"/g,'&quot;')}" autocomplete="off"><button class="item-del" title="Remove">✕</button>`;

    const input = item.querySelector('.item-input');
    const del   = item.querySelector('.item-del');

    // Edit inline
    let debounce;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        const newVal = input.value.trim().toUpperCase();
        if (newVal) {
          lists[key][idx] = newVal;
        } else {
          lists[key].splice(idx, 1);
          renderColumn(key);
        }
        schedSave(key);
      }, 400);
    });

    input.addEventListener('blur', () => {
      const newVal = input.value.trim().toUpperCase();
      if (!newVal) {
        lists[key].splice(idx, 1);
        renderColumn(key);
        schedSave(key);
      }
    });

    // Delete
    del.addEventListener('click', () => {
      lists[key].splice(idx, 1);
      renderColumn(key);
      schedSave(key);
    });

    body.appendChild(item);
  });
}

// ── Add item ──────────────────────────────────────
function addItem(key) {
  const input = document.getElementById('add-'+key);
  const val = input.value.trim().toUpperCase();
  if (!val) { input.focus(); return; }
  if (lists[key].includes(val)) { input.select(); return; }
  lists[key].push(val);
  input.value = '';
  renderColumn(key);
  schedSave(key);
  // Scroll to bottom of list
  const body = document.getElementById('body-'+key);
  body.scrollTop = body.scrollHeight;
  input.focus();
}

KEYS.forEach(key => {
  document.getElementById('add-'+key).addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem(key);
  });
  document.querySelector(`.add-btn[data-key="${key}"]`).addEventListener('click', () => addItem(key));
});

// ── Export / Import ───────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  const max = Math.max(lists.feedNames.length, lists.sources.length, lists.destinations.length);
  let csv = 'Feed Name,Source,Destination\n';
  for (let i=0; i<max; i++) {
    csv += `"${lists.feedNames[i]||''}","${lists.sources[i]||''}","${lists.destinations[i]||''}"\n`;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'toc-lists.csv'; a.click();
});

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const lines = ev.target.result.split(/[\r\n]+/).filter(l=>l.trim());
    const start = lines[0].toLowerCase().includes('feed') ? 1 : 0;
    const fn=[], src=[], dst=[];
    lines.slice(start).forEach(line => {
      const parts = line.split(',').map(p=>p.replace(/^"|"$/g,'').trim().toUpperCase());
      if(parts[0]) fn.push(parts[0]);
      if(parts[1]) src.push(parts[1]);
      if(parts[2]) dst.push(parts[2]);
    });
    if (!confirm(`Import ${fn.length} feed names, ${src.length} sources, ${dst.length} destinations? This replaces current lists.`)) return;
    lists.feedNames=[...new Set(fn)];
    lists.sources=[...new Set(src)];
    lists.destinations=[...new Set(dst)];
    KEYS.forEach(k=>renderColumn(k));
    Promise.all(KEYS.map(k=>saveKey(k)));
  };
  reader.readAsText(file);
  e.target.value = '';
});
</script>
</body>
</html>
